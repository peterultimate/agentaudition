services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentaudition
      POSTGRES_PASSWORD: agentaudition
      POSTGRES_DB: agentaudition
    ports:
      - '5432:5432'
    volumes:
      - agentaudition-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentaudition']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agentaudition-pg:
